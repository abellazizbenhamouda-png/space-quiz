<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172b">
  <title>Orbit Quest — Space Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f3f5fc;
      --surface: #fff;
      --surface-soft: #f7f8fd;
      --ink: #1b2340;
      --muted: #78819b;
      --line: #e7eaf3;
      --accent: #6558e8;
      --accent-soft: #efedff;
      --hud: #286d83;
      --hud-soft: #eaf5f8;
      --hud-grid: rgb(40 109 131 / 4%);
      --green: #168a5b;
      --green-soft: #e9f8f0;
      --red: #d84b61;
      --red-soft: #fff0f2;
      --shadow: 0 24px 70px rgb(34 43 84 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101629;
        --surface: #191f35;
        --surface-soft: #202740;
        --ink: #f4f5ff;
        --muted: #a4abc2;
        --line: #303852;
        --accent: #a59aff;
        --accent-soft: #302c54;
        --hud: #77d7e5;
        --hud-soft: #1c3442;
        --hud-grid: rgb(119 215 229 / 4%);
        --green: #6be0a4;
        --green-soft: #193b35;
        --red: #ff8293;
        --red-soft: #492b3a;
        --shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, rgb(120 106 255 / 11%), transparent 31rem),
        radial-gradient(ellipse at 88% 90%, rgb(37 198 174 / 9%), transparent 28rem),
        var(--page);
      font-size: 15px;
    }

    .quiz-shell { width: min(100%, 520px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: linear-gradient(145deg, #8274ff, #5948d5);
      box-shadow: 0 6px 16px rgb(101 88 232 / 28%);
      font-size: 16px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-content {
      position: relative;
      isolation: isolate;
      padding: 24px 30px 30px;
      background-color: var(--surface);
      background-image:
        linear-gradient(var(--hud-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--hud-grid) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .card-content::before {
      position: absolute;
      z-index: -1;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--hud), var(--accent) 56%, transparent);
      content: "";
    }

    .mission-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--hud);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .mission-id {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .mission-icon {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--hud) 35%, transparent);
      border-radius: 7px;
      background: var(--hud-soft);
      font-size: 14px;
      letter-spacing: 0;
    }

    .mission-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .09em;
      white-space: nowrap;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 15%, transparent);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
      color: var(--hud);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 650;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface-soft);
      font-variant-numeric: tabular-nums;
    }

    .score-star { color: #f0ad3d; }

    .progress-track {
      height: 9px;
      overflow: hidden;
      margin-bottom: 30px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: repeating-linear-gradient(90deg, var(--surface-soft) 0 8px, var(--line) 8px 10px);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--hud), var(--accent));
      transition: width 450ms cubic-bezier(.2, .8, .2, 1);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--hud);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1, h2 {
      margin-bottom: 24px;
      font-size: clamp(22px, 5vw, 29px);
      line-height: 1.24;
      letter-spacing: -.035em;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 5px 16px rgb(101 88 232 / 10%);
    }

    .answer:focus-visible, .next-button:focus-visible, .review-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--hud);
      background: var(--hud-soft);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-soft);
      animation: pop-in 380ms ease both;
    }

    .answer.correct .answer-letter { color: white; background: var(--green); }

    .answer.incorrect {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-soft);
      animation: shake 420ms ease both;
    }

    .answer.incorrect .answer-letter { color: white; background: var(--red); }

    .answer.reveal-correct {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .answer.reveal-correct .answer-letter { color: white; background: var(--green); }

    .feedback {
      min-height: 0;
      margin-top: 14px;
      border-radius: 13px;
      font-size: 13px;
      line-height: 1.55;
    }

    .feedback:not(:empty) { padding: 12px 14px; }
    .feedback.is-correct { color: var(--green); background: var(--green-soft); }
    .feedback.is-wrong { color: var(--red); background: var(--red-soft); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .next-button, .review-button, .restart-button {
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #7668f0, #5d50d7);
      box-shadow: 0 8px 18px rgb(101 88 232 / 22%);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .next-button:hover, .review-button:hover, .restart-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgb(101 88 232 / 30%);
    }

    .result {
      padding: 42px 30px 34px;
      text-align: center;
    }

    .result-emoji {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--surface-soft);
      font-size: 52px;
      animation: pop-in 500ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .result h1 { margin-bottom: 10px; }
    .result-copy { margin-bottom: 22px; color: var(--muted); line-height: 1.6; }

    .result-score {
      display: inline-block;
      margin-bottom: 24px;
      padding: 10px 15px;
      border-radius: 12px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 16px;
      font-weight: 800;
    }

    .result .review-button, .result .restart-button { display: block; margin: 0 auto; }
    .result .review-button { margin-bottom: 12px; }

    .hidden { display: none !important; }

    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-5px); }
      30%, 60%, 90% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    @keyframes pop-in {
      0% { transform: scale(.94); }
      55% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 480px) {
      body { padding: 24px 14px; }
      .card-content { padding: 21px 20px 23px; }
      .mission-bar { margin-bottom: 19px; }
      .result { padding: 34px 22px 28px; }
    }
  </style>
</head>
<body>
  <main class="quiz-shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit Quest</div>

    <section class="card" id="quiz-card" aria-label="Space exploration quiz">
      <div class="card-content" id="quiz-content">
        <div class="mission-bar">
          <span class="mission-id"><span class="mission-icon" aria-hidden="true">⌁</span> Mission control</span>
          <span class="mission-status"><span class="status-light" aria-hidden="true"></span> Flight systems ready</span>
        </div>
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score"><span class="score-star" aria-hidden="true">★</span> Score <span id="score">0</span></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="eyebrow" id="category">The solar system</p>
        <h1 id="question" tabindex="-1"></h1>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="actions">
          <button class="next-button hidden" id="next-button" type="button">Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="result hidden" id="result" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const questions = [
      {
        category: "The solar system",
        question: "Which planet is known as the Red Planet?",
        options: ["Venus", "Mars", "Jupiter", "Mercury"],
        answer: 1,
        fact: "Mars looks red because iron-rich dust on its surface has rusted."
      },
      {
        category: "Our cosmic neighborhood",
        question: "What is the name of the galaxy that contains our Solar System?",
        options: ["Andromeda", "Whirlpool Galaxy", "The Milky Way", "Sombrero Galaxy"],
        answer: 2,
        fact: "Our Solar System sits in one of the Milky Way’s spiral arms, about 26,000 light-years from its center."
      },
      {
        category: "Moon missions",
        question: "Who was the first person to walk on the Moon?",
        options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"],
        answer: 2,
        fact: "Neil Armstrong stepped onto the lunar surface during Apollo 11 on July 20, 1969."
      },
      {
        category: "Star stuff",
        question: "What is the closest star to Earth?",
        options: ["Proxima Centauri", "Sirius", "The Sun", "Alpha Centauri A"],
        answer: 2,
        fact: "The Sun is about 150 million kilometers away—and its light takes roughly 8 minutes to reach us."
      },
      {
        category: "Giants of space",
        question: "Which planet has the most visible rings?",
        options: ["Neptune", "Saturn", "Uranus", "Jupiter"],
        answer: 1,
        fact: "Saturn’s spectacular rings are made mostly of countless pieces of ice and rock."
      },
      {
        category: "On the move",
        question: "What force keeps planets in orbit around the Sun?",
        options: ["Magnetism", "Gravity", "Friction", "Solar wind"],
        answer: 1,
        fact: "The Sun’s gravity continually bends each planet’s path into an orbit."
      },
      {
        category: "Deep space",
        question: "What is a light-year a measure of?",
        options: ["Time", "Brightness", "Distance", "Speed"],
        answer: 2,
        fact: "A light-year is the distance light travels in one year: about 9.46 trillion kilometers."
      },
      {
        category: "Space technology",
        question: "Which telescope launched in 2021 to observe the early universe?",
        options: ["Hubble Space Telescope", "Kepler Space Telescope", "James Webb Space Telescope", "Chandra X-ray Observatory"],
        answer: 2,
        fact: "The James Webb Space Telescope observes infrared light, helping us study some of the earliest galaxies."
      },
      {
        category: "Moon facts",
        question: "Why do we see different phases of the Moon?",
        options: ["Earth’s shadow covers it each night", "Clouds hide parts of it", "We see different portions of its sunlit half", "The Moon changes shape"],
        answer: 2,
        fact: "The Moon is always half-lit by the Sun; its phase depends on how much of that lit half we can see from Earth."
      },
      {
        category: "The big picture",
        question: "What is the name for a rocky object that reaches Earth’s surface from space?",
        options: ["Asteroid", "Meteorite", "Comet", "Meteor"],
        answer: 1,
        fact: "A space rock is a meteor while glowing through the atmosphere; if a piece lands, it’s a meteorite."
      }
    ];

    const questionCount = document.querySelector("#question-count");
    const scoreDisplay = document.querySelector("#score");
    const progressTrack = document.querySelector(".progress-track");
    const progressFill = document.querySelector("#progress-fill");
    const categoryDisplay = document.querySelector("#category");
    const questionDisplay = document.querySelector("#question");
    const answersDisplay = document.querySelector("#answers");
    const feedbackDisplay = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    const quizContent = document.querySelector("#quiz-content");
    const resultDisplay = document.querySelector("#result");

    let questionIndex = 0;
    let score = 0;
    let answered = false;
    let activeQuestions = questions;
    let missedQuestions = [];
    let isReviewing = false;

    function renderQuestion() {
      const current = activeQuestions[questionIndex];
      questionCount.textContent = `Question ${questionIndex + 1} of ${activeQuestions.length}`;
      progressTrack.setAttribute("aria-valuemax", activeQuestions.length);
      scoreDisplay.textContent = score;
      categoryDisplay.textContent = current.category;
      questionDisplay.textContent = current.question;
      feedbackDisplay.textContent = "";
      feedbackDisplay.className = "feedback";
      nextButton.classList.add("hidden");
      answersDisplay.replaceChildren();
      answered = false;

      current.options.forEach((option, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + optionIndex)}</span><span>${option}</span>`;
        button.addEventListener("click", () => selectAnswer(optionIndex));
        answersDisplay.append(button);
      });
    }

    function selectAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const current = activeQuestions[questionIndex];
      const buttons = [...answersDisplay.querySelectorAll(".answer")];
      const isCorrect = selectedIndex === current.answer;

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === current.answer) button.classList.add(isCorrect && index === selectedIndex ? "correct" : "reveal-correct");
        if (!isCorrect && index === selectedIndex) button.classList.add("incorrect");
      });

      if (isCorrect) {
        if (!isReviewing) score += 1;
        scoreDisplay.textContent = score;
        feedbackDisplay.textContent = `Correct! ${current.fact}`;
        feedbackDisplay.classList.add("is-correct");
      } else {
        if (!isReviewing) missedQuestions.push(current);
        feedbackDisplay.textContent = `Not quite! ${current.fact}`;
        feedbackDisplay.classList.add("is-wrong");
      }

      const completed = questionIndex + 1;
      progressFill.style.width = `${(completed / activeQuestions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", completed);
      nextButton.innerHTML = completed === activeQuestions.length
        ? isReviewing ? "Return to results <span aria-hidden=\"true\">→</span>" : "See your results <span aria-hidden=\"true\">→</span>"
        : "Next question <span aria-hidden=\"true\">→</span>";
      nextButton.classList.remove("hidden");
      nextButton.focus();
    }

    function showResults() {
      quizContent.classList.add("hidden");
      const percentage = score / questions.length;
      const result = percentage === 1
        ? { emoji: "🏆", title: "Out of this world!", copy: "A perfect flight through the cosmos. You really know your space." }
        : percentage >= 0.7
          ? { emoji: "🚀", title: "Stellar work!", copy: "You’ve got serious cosmic knowledge. Keep exploring!" }
          : percentage >= 0.4
            ? { emoji: "🌙", title: "Nice trip, space explorer!", copy: "You’re finding your orbit. There’s always more universe to discover." }
            : { emoji: "🪐", title: "Mission complete!", copy: "Every great explorer starts somewhere. Ready for another launch?" };

      resultDisplay.innerHTML = `
        <div class="result-emoji" aria-hidden="true">${result.emoji}</div>
        <p class="eyebrow">Mission complete</p>
        <h1>${result.title}</h1>
        <p class="result-copy">${result.copy}</p>
        <div class="result-score">${score} out of ${questions.length} correct</div>
        ${missedQuestions.length > 0 ? '<button class="review-button" type="button">Review missed questions <span aria-hidden="true">↻</span></button>' : ""}
        <button class="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
      `;
      resultDisplay.classList.remove("hidden");
      resultDisplay.querySelector(".restart-button").addEventListener("click", restartQuiz);
      const reviewButton = resultDisplay.querySelector(".review-button");
      if (reviewButton) {
        reviewButton.addEventListener("click", startReview);
        reviewButton.focus();
      } else {
        resultDisplay.querySelector(".restart-button").focus();
      }
    }

    function startReview() {
      isReviewing = true;
      activeQuestions = missedQuestions;
      questionIndex = 0;
      resultDisplay.classList.add("hidden");
      quizContent.classList.remove("hidden");
      progressFill.style.width = "0%";
      progressTrack.setAttribute("aria-valuenow", "0");
      renderQuestion();
      questionDisplay.focus();
    }

    function restartQuiz() {
      activeQuestions = questions;
      missedQuestions = [];
      isReviewing = false;
      questionIndex = 0;
      score = 0;
      resultDisplay.classList.add("hidden");
      quizContent.classList.remove("hidden");
      progressFill.style.width = "0%";
      progressTrack.setAttribute("aria-valuenow", "0");
      renderQuestion();
      questionDisplay.focus();
    }

    nextButton.addEventListener("click", () => {
      if (questionIndex === activeQuestions.length - 1) {
        isReviewing = false;
        activeQuestions = questions;
        showResults();
        return;
      }
      questionIndex += 1;
      renderQuestion();
      questionDisplay.focus();
    });

    renderQuestion();
  </script>
</body>
</html>
